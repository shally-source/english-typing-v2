<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳附英文打字小勇士 - 成績上傳版</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <div class="logo-section">
                <div class="logo-icon">⌨️</div>
                <div class="logo-text">
                    <h1>澳附英文打字小勇士</h1>
                    <div class="student-badge">
                        <span class="student-badge-dot"></span>
                        <span id="studentInfoDisplay">未登錄</span>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-card stat-timer">
                    <span class="stat-icon">⏱️</span>
                    <div>
                        <div class="stat-value" id="timer">05:00</div>
                        <div class="stat-label">剩餘</div>
                    </div>
                </div>
                <div class="stat-card stat-progress">
                    <span class="stat-icon">📊</span>
                    <div>
                        <div class="stat-value" id="progressDisplay">0%</div>
                        <div class="stat-label">進度</div>
                    </div>
                </div>
                <div class="stat-card stat-speed">
                    <span class="stat-icon">🚀</span>
                    <div>
                        <div class="stat-value" id="speedDisplay">0.00</div>
                        <div class="stat-label">字/秒</div>
                    </div>
                </div>
                <div class="stat-card stat-accuracy">
                    <span class="stat-icon">🎯</span>
                    <div>
                        <div class="stat-value" id="accuracyDisplay">100%</div>
                        <div class="stat-label">準確</div>
                    </div>
                </div>
                <div class="stat-card stat-errors">
                    <span class="stat-icon">❌</span>
                    <div>
                        <div class="stat-value" id="errorDisplay">0</div>
                        <div class="stat-label">錯字</div>
                    </div>
                </div>
                <div class="stat-card stat-combo">
                    <span class="stat-icon">🔥</span>
                    <div>
                        <div class="stat-value" id="comboDisplay">0</div>
                        <div class="stat-label">連續</div>
                    </div>
                </div>
            </div>

            <div class="header-actions">
                <button id="pauseBtn" class="pause-btn hidden">
                    <span>⏸️</span>
                    <span>暫停</span>
                </button>
                <button id="openTeacherBtn" class="action-btn teacher-btn hidden">
                    <span>🛠️</span>
                    <span>教師後台</span>
                </button>
                <span id="loggedInInfo" class="logged-in-info hidden">
                    <span class="user-avatar" id="userAvatar">?</span>
                    <span id="loggedInName"></span>
                    <button id="logoutBtn" class="logout-btn">登出</button>
                </span>
                <button id="openArticleBtn" class="action-btn" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);">
                    <span>📚</span>
                    <span id="actionBtnText">選擇文章</span>
                </button>
                <button id="openLoginBtn" class="action-btn secondary hidden">
                    <span>🔐</span>
                    <span>登入</span>
                </button>
            </div>
        </header>

        <!-- Text Display -->
        <div id="textDisplay" class="text-area"></div>

        <!-- Keyboard -->
        <div class="keyboard-wrapper">
            <div id="keyboard" class="keyboard"></div>
        </div>
    </div>

    <!-- Hidden Input -->
    <input type="text" id="hiddenInput">

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                <h2>🔐 學生登入</h2>
            </div>
            <div class="modal-body">
                <div class="login-card">
                    <div class="login-title">
                        <span>🔑</span>
                        <span>輸入您的帳號與密碼</span>
                    </div>
                    <div id="loginError" class="login-error"></div>
                <div class="input-group-full">
                    <label>登入帳號</label>
                    <input type="text" id="loginAccount" class="login-input" placeholder="請輸入帳號" autocomplete="off">
                </div>
                <div class="input-group-full">
                    <label>密碼 (ID)</label>
                    <input type="password" id="loginPassword" class="login-input" placeholder="請輸入密碼">
                </div>
                    <button id="loginBtn" class="btn-login">登入 🔓</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Article Selection Modal -->
    <div id="articleModal" class="modal-overlay hidden">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h2>選擇練習文章</h2>
                <button id="articleModalClose" class="modal-close-btn">✕</button>
            </div>
            <div class="modal-body">
                <div id="articleGrid" class="article-grid"></div>
                <input type="file" id="txt-file-input" accept=".txt" style="display: none;">
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>📝 載入練習文章</h2>
                <button id="importModalClose" class="modal-close-btn">✕</button>
            </div>
            <div class="modal-body">
                <div class="file-upload">
                    <label>📄 載入 .txt 文字檔</label>
                    <input type="file" id="fileLoader" accept=".txt">
                </div>

                <div class="divider">或直接貼上</div>

                <div class="input-group">
                    <label>粘貼文章內容</label>
                    <textarea id="articleInput" placeholder="在此粘貼練習文章..."></textarea>
                    <div class="char-count-display"><span id="charCount">0</span> 字</div>
                </div>

                <button id="confirmBtn" class="btn-primary">開始挑戰 🚀</button>
            </div>
        </div>
    </div>

    <!-- Teacher Management Modal -->
    <div id="teacherModal" class="modal-overlay hidden">
        <div class="modal teacher-modal">
            <div class="modal-header">
                <h2>🛠️ 教師管理後台</h2>
                <button id="teacherModalClose" class="modal-close-btn" aria-label="關閉教師後台">✕</button>
            </div>
            <div class="modal-body">
                <div class="teacher-tabs" role="tablist">
                    <button id="teacherArticleTab" class="teacher-tab active" type="button" role="tab" aria-selected="true">📝 派發預設文章</button>
                    <button id="teacherScoresTab" class="teacher-tab" type="button" role="tab" aria-selected="false">📊 成績查詢與匯出</button>
                </div>
                <section id="teacherArticlePanel" class="teacher-panel">
                    <section class="cloud-articles-overview">
                        <div class="cloud-articles-heading">
                            <h3>📋 目前雲端已派發文章</h3>
                            <button id="refreshCloudArticlesBtn" class="btn-primary cloud-refresh-btn" type="button">🔄 重新整理雲端文章</button>
                        </div>
                        <p id="cloudArticlesStatus" class="score-load-status" aria-live="polite"></p>
                        <div id="cloudArticlesListContainer" class="cloud-articles-list"></div>
                    </section>
                    <section id="teacherArticleForm" class="teacher-article-form">
                        <h3>➕ 新增 / 更新預設文章</h3>
                        <div class="input-group">
                            <label for="targetGroupSelect">派發對象</label>
                            <select id="targetGroupSelect">
                                <option value="ALL">ALL (全校預設)</option>
                                <option value="P1">P1</option>
                                <option value="P2">P2</option>
                                <option value="P3">P3</option>
                                <option value="P4">P4</option>
                                <option value="P5">P5</option>
                                <option value="P6">P6</option>
                                <option value="CUSTOM">指定班級…</option>
                            </select>
                        </div>
                        <div id="customTargetGroupWrap" class="input-group hidden">
                            <label for="customTargetGroup">班級代碼 (例如 P2A)</label>
                            <input id="customTargetGroup" type="text" maxlength="8" placeholder="P2A">
                        </div>
                        <div class="input-group">
                            <label for="teacherArticleTitle">文章標題</label>
                            <input id="teacherArticleTitle" type="text" maxlength="120" placeholder="輸入文章標題">
                        </div>
                        <div class="file-upload teacher-file-upload">
                            <label for="teacherArticleFile">📄 上傳 .txt 純文字檔</label>
                            <input id="teacherArticleFile" type="file" accept=".txt,text/plain">
                        </div>
                        <div class="input-group">
                            <label for="teacherArticleContent">英文文章內容</label>
                            <textarea id="teacherArticleContent" rows="9" placeholder="在此貼上或編輯英文文章..."></textarea>
                        </div>
                        <button id="saveTeacherArticleBtn" class="btn-primary teacher-submit-btn" type="button">💾 儲存並派發至雲端</button>
                    </section>
                </section>
                <section id="teacherScoresPanel" class="teacher-panel hidden">
                    <div class="teacher-filter-row">
                        <div class="input-group">
                            <label for="exportClassSelect">班級篩選</label>
                            <select id="exportClassSelect"></select>
                        </div>
                        <div class="input-group">
                            <label for="exportRuleSelect">篩選規則</label>
                            <select id="exportRuleSelect">
                                <option value="all">所有歷史練習紀錄</option>
                                <option value="date">指定日期</option>
                                <option value="best">每位學生最高分</option>
                            </select>
                        </div>
                        <div id="exportDateWrap" class="input-group hidden">
                            <label for="exportDateInput">測驗日期</label>
                            <input id="exportDateInput" type="date">
                        </div>
                    </div>
                    <div class="teacher-score-actions">
                        <button id="loadCloudScoresBtn" class="btn-primary" type="button">🔄 載入雲端成績</button>
                        <button id="exportScoresBtn" class="btn-primary export-btn" type="button" disabled>📥 匯出 Excel (CSV)</button>
                    </div>
                    <p id="scoreLoadStatus" class="score-load-status" aria-live="polite"></p>
                    <div class="score-table-wrap">
                        <table class="score-table">
                            <thead>
                                <tr>
                                    <th>測驗時間</th>
                                    <th>學號</th>
                                    <th>帳號</th>
                                    <th>姓名</th>
                                    <th>班級</th>
                                    <th>總分</th>
                                    <th>速度</th>
                                    <th>準確度</th>
                                    <th>錯字數</th>
                                </tr>
                            </thead>
                            <tbody id="scorePreviewBody">
                                <tr><td colspan="9" class="score-empty">尚未載入成績</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Game Countdown Overlay -->
    <div id="countdownOverlay" class="countdown-overlay hidden">
        <div class="countdown-number" id="countdownNumber">3</div>
        <div class="countdown-text">準備開始！</div>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseOverlay" class="pause-overlay hidden">
        <div class="pause-content">
            <div class="pause-icon">⏸️</div>
            <h2>遊戲暫停</h2>
            <p>按空白鍵或點擊繼續</p>
            <button id="resumeBtn" class="btn-primary">繼續挑戰 ▶️</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal-overlay result-modal hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="resultTitle">🏆 練習成果</h2>
            </div>
            <div class="modal-body">
                <div id="resultStats"></div>
                <div class="result-grade" id="resultGrade"></div>
                <div id="uploadStatus" class="upload-status uploading">正在同步成績至雲端...</div>
                <button id="restartBtn" class="btn-primary">再試一次 💪</button>
            </div>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
